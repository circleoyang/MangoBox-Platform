name: Check Student Documentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/student-guide/**"
      - "scripts/check_student_docs.py"
      - "scripts/check_student_search.py"
      - "scripts/check_api_reference_completeness.py"
      - ".github/workflows/check-student-docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/student-guide/**"
      - "scripts/check_student_docs.py"
      - "scripts/check_student_search.py"
      - "scripts/check_api_reference_completeness.py"
      - ".github/workflows/check-student-docs.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate profile/module/document coverage
        run: python scripts/check_student_docs.py
      - name: Validate merged method-level API search contract
        run: python scripts/check_student_search.py
      - name: Validate structured API Reference coverage
        run: python scripts/check_api_reference_completeness.py
      - name: Check documentation JavaScript syntax
        run: |
          node --check docs/student-guide/site/api-contract-overlay-v20260906.js
          node --check docs/student-guide/site/api-reference-details.js
          node --check docs/student-guide/site/method-search.js
          node --check docs/student-guide/site/ble-control-api-overlay-v20260913.js
