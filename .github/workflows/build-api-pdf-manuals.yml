name: Build MangoBox API PDF Manuals
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/student-guide/**'
      - 'scripts/build_api_pdf_manuals_v2.py'
      - '.github/workflows/build-api-pdf-manuals.yml'
  push:
    branches: [main]
    paths:
      - 'docs/student-guide/**'
      - 'scripts/build_api_pdf_manuals_v2.py'
      - '.github/workflows/build-api-pdf-manuals.yml'
jobs:
  manuals:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install embeddable Traditional Chinese font and PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-bkai00mp poppler-utils
          python -m pip install 'reportlab>=4,<5' 'pypdf>=5,<7'
      - name: Build current MangoLite + Pico 2 W reference and guide
        run: python scripts/build_api_pdf_manuals_v2.py --language zh-TW --kind both
      - name: Check PDF content and structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          files=list(Path('dist/api-manuals').glob('*.pdf'))
          assert len(files)==2, files
          for f in files:
              assert f.stat().st_size>4000, (f,f.stat().st_size)
              assert f.read_bytes().startswith(b'%PDF-')
              reader=PdfReader(str(f))
              assert len(reader.pages)>=8, (f,'no pages')
              text=' '.join(page.extract_text() or '' for page in reader.pages)
              assert 'MangoBox' in text, (f,'missing title')
              assert 'Pot' in text or 'pot' in text, (f,'missing new Pot module')
              assert '電位器' in text or '感測' in text, (f,'Traditional Chinese text missing')
              assert len(reader.outline)>5, (f,'missing PDF bookmarks')
              assert sum(len(page.get('/Annots',[])) for page in reader.pages)>10, (f,'missing links')
          print('PDF build smoke PASS:',len(files))
          PY
      - name: Check PDF rendering without font errors
        run: |
          for file in dist/api-manuals/*.pdf; do
            pdftoppm -f 2 -l 2 -scale-to 900 -png -singlefile "$file" /tmp/mangobox-pdf-check 2>/tmp/mangobox-render-errors.log
            test -s /tmp/mangobox-pdf-check.png
            if grep -Ei 'syntax error|unknown font|cmap file' /tmp/mangobox-render-errors.log; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MangoBox-API-Manuals
          path: dist/api-manuals/*.pdf
          retention-days: 90
