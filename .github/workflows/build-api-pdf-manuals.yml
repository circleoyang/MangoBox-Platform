name: Build MangoBox API PDF Manuals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/student-guide/**'
      - 'scripts/build_api_pdf_manuals.py'
      - '.github/workflows/build-api-pdf-manuals.yml'
jobs:
  manuals:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5'
      - name: Build current MangoLite + Pico 2 W reference and guide
        run: python scripts/build_api_pdf_manuals.py --language zh-TW --kind both
      - name: Check PDF content and structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from reportlab.pdfbase.pdfdoc import PDFDocument
          files=list(Path('dist/api-manuals').glob('*.pdf'))
          assert len(files)==2, files
          for f in files:
              assert f.stat().st_size>4000, (f,f.stat().st_size)
              assert f.read_bytes().startswith(b'%PDF-')
          print('PDF build smoke PASS:',len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MangoBox-API-Manuals
          path: dist/api-manuals/*.pdf
          retention-days: 90
